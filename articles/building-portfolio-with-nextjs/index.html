t-primaryDark">#framer-motion</div></div></div><div class="xs:mt-3"><div>2026<!-- --> © All Rights Reserved</div><div class="w-full flex justify-end mx-auto text-xs">Inspired by <a href="https://github.com/codebucks27" class="underline underline-offset-2 cursor-pointer">CodeBucks</a></div></div></div></footer></main></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"article":{"id":"building-portfolio-with-nextjs","content":"\n# How I Built My Portfolio Website with Next.js\n\nCreating a portfolio website is an essential step for any web developer. It serves as both a showcase of your skills and a practical demonstration of your abilities. In this article, I'll walk through how I built this very website using Next.js, React, and Tailwind CSS.\n\n## Why Next.js?\n\nWhen choosing a framework for my portfolio, I had several requirements:\n\n1. **Performance**: The site needed to be fast and responsive\n2. **SEO**: Good search engine visibility was a must\n3. **Developer Experience**: I wanted a pleasant development workflow\n4. **Static Generation**: For optimal hosting and performance\n\nNext.js met all these criteria with its hybrid rendering capabilities, excellent developer experience, and built-in optimizations. Some specific advantages included:\n\n- **Static Generation**: Pre-rendering pages at build time for faster load times\n- **Image Optimization**: Automatic handling of responsive images\n- **Built-in Routing**: Simple page-based routing system\n- **API Routes**: Backend functionality without a separate service\n\n## Styling with Tailwind CSS\n\nFor styling, I chose Tailwind CSS for its utility-first approach. This decision was based on:\n\n- **Development Speed**: Creating custom UI quickly without context switching\n- **Consistency**: Built-in design system with spacing, color scales, etc.\n- **Flexibility**: Easy customization without fighting the framework\n- **Performance**: Small bundle size through purging unused styles\n\nTailwind allowed me to:\n\n1. Build a consistent design system\n2. Create responsive layouts efficiently\n3. Implement dark mode with minimal effort\n4. Maintain a clear separation between structure and style\n\n## Animations with Framer Motion\n\nTo bring life to the interface, I integrated Framer Motion for animations. This library provided:\n\n- **Declarative Animations**: Simple API for complex animations\n- **Gestures**: Easy implementation of hover and tap effects\n- **Transitions**: Smooth page transitions and element entrances\n- **Performance**: Optimized rendering and minimal impact on performance\n\n## Multi-language Support\n\nSince I wanted to reach a global audience, I implemented multi-language support using:\n\n- React Context for language state management\n- JSON-based translation files\n- Language detection based on browser settings\n- Persistent language preference with localStorage\n\n## Deployment and Hosting\n\nFor deployment, I chose GitHub Pages due to:\n\n- **Integration with Git Workflow**: Automatic deployment on push\n- **Free Hosting**: No costs for a static site\n- **Custom Domain**: Easy to configure with my domain\n- **CDN**: Global content delivery network\n\n## Lessons Learned\n\nBuilding this portfolio taught me several valuable lessons:\n\n1. **Start with a solid architecture**: Planning the structure saved time later\n2. **Mobile-first approach works**: Starting with mobile constraints led to better design\n3. **Invest in animations**: Small motion details greatly improve UX\n4. **Performance matters**: Optimizing early prevents issues later\n\n## Conclusion\n\nCreating this portfolio with Next.js and Tailwind CSS was an excellent learning experience. The combination provided a powerful, flexible foundation that allowed me to focus on design and content rather than fighting with technical limitations.\n\nIf you're considering building your own portfolio, I highly recommend this stack for its developer experience, performance, and flexibility. Feel free to reach out through my contact form if you have any questions about my implementation!\n","readingTime":3,"title":"How I Built My Portfolio Website with Next.js","date":"2025-03-25","lastUpdated":"2025-03-28","author":"Petru Tîrlă","excerpt":"A detailed look at the technologies and techniques I used to build my portfolio website using Next.js, React, and Tailwind CSS.","coverImage":"/images/blog/portfolio-creation.jpg","tags":["Next.js","React","Web Development","Tailwind CSS","Portfolio"],"category":"Projects","mdxSource":{"compiledSource":"\"use strict\";\nconst {Fragment: _Fragment, jsx: _jsx, jsxs: _jsxs} = arguments[0];\nconst {useMDXComponents: _provideComponents} = arguments[0];\nfunction _createMdxContent(props) {\n  const _components = {\n    h1: \"h1\",\n    h2: \"h2\",\n    li: \"li\",\n    ol: \"ol\",\n    p: \"p\",\n    strong: \"strong\",\n    ul: \"ul\",\n    ..._provideComponents(),\n    ...props.components\n  };\n  return _jsxs(_Fragment, {\n    children: [_jsx(_components.h1, {\n      children: \"How I Built My Portfolio Website with Next.js\"\n    }), \"\\n\", _jsx(_components.p, {\n      children: \"Creating a portfolio website is an essential step for any web developer. It serves as both a showcase of your skills and a practical demonstration of your abilities. In this article, I'll walk through how I built this very website using Next.js, React, and Tailwind CSS.\"\n    }), \"\\n\", _jsx(_components.h2, {\n      children: \"Why Next.js?\"\n    }), \"\\n\", _jsx(_components.p, {\n      children: \"When choosing a framework for my portfolio, I had several requirements:\"\n    }), \"\\n\", _jsxs(_components.ol, {\n      children: [\"\\n\", _jsxs(_components.li, {\n        children: [_jsx(_components.strong, {\n          children: \"Performance\"\n        }), \": The site needed to be fast and responsive\"]\n      }), \"\\n\", _jsxs(_components.li, {\n        children: [_jsx(_components.strong, {\n          children: \"SE
